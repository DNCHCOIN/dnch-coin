name: Build DNCH Mining Farm Android
on:
  push:
    branches: [dnch-mining-farm-android]
    paths:
      - 'games/dnch-mining-farm/**'
      - '.github/workflows/build-dnch-mining-farm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.2
    defaults:
      run:
        working-directory: games/dnch-mining-farm
    steps:
      - uses: actions/checkout@v4
      - name: Generate original assets
        run: |
          apt-get update -qq
          apt-get install -y python3-pil unzip
          python3 tools/generate_assets.py
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Configure Godot SDK
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.5.2.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.5.tres "$HOME/.config/godot/"
      - name: Import and validate project
        run: |
          godot --headless --path . --editor --import > build_import.log 2>&1 || (cat build_import.log && exit 1)
          grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error parsing' build_import.log && (cat build_import.log && exit 1) || true
      - name: Functional game smoke test
        run: |
          timeout 45s godot --headless --path . --script res://scripts/smoke_test.gd > smoke_test.log 2>&1 || (cat smoke_test.log && exit 1)
          cat smoke_test.log
          grep -F 'PASS: 3D facility' smoke_test.log
          if grep -E 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error' smoke_test.log; then exit 1; fi
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DNCH_Mining_Farm_Android.apk
          test -s build/DNCH_Mining_Farm_Android.apk
          unzip -t build/DNCH_Mining_Farm_Android.apk | tail -1
          ls -lh build/DNCH_Mining_Farm_Android.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DNCH_Mining_Farm_Full_Game_Android_APK
          path: games/dnch-mining-farm/build/DNCH_Mining_Farm_Android.apk
          if-no-files-found: error
