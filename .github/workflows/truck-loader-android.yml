name: Truck Loader Android APK
on:
  push:
    branches: [main, feature/truck-loader-android]
    paths:
      - 'truck-loader/**'
      - '.github/workflows/truck-loader-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install packages and copy the actual web planner
        working-directory: truck-loader/mobile
        run: |
          npm install --no-audit --no-fund
          npm run prepare
      - name: Create and sync Android platform
        working-directory: truck-loader/mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Install native PDF and file picker plugins
        working-directory: truck-loader/mobile
        run: |
          mkdir -p android/app/src/main/java/com/dnch/truckloader
          cp native/*.java android/app/src/main/java/com/dnch/truckloader/
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          if 'ACCESS_COARSE_LOCATION' not in text:
              text=text.replace('<application','<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application',1)
          path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace Android icon with original NTZ square
        working-directory: truck-loader/mobile
        run: |
          python -m pip install --disable-pip-version-check pillow
          python generate-icons.py
      - name: Compile Android APK
        working-directory: truck-loader/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DNCH-Truck-Loader-Android-debug
          path: truck-loader/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
