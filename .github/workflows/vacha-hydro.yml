name: Update Vacha hydrology (5 min check)
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/vacha-hydro.yml'
      - 'vacha-river/scripts/update_hydro.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vacha-hydrology
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify on-demand hydrology gateway
        shell: bash
        continue-on-error: true
        run: |
          python -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("https://wthzcqgzcbkvhovtcmoe.supabase.co/functions/v1/vacha-hydro",timeout=20)); print("NIMH edge latest:",d.get("latest",{}).get("observedAt"),"level",d.get("latest",{}).get("levelCm"),"error",d.get("error"))'
      - name: Get public observations from NIMH
        run: python vacha-river/scripts/update_hydro.py
      - name: Commit new observations if changed
        shell: bash
        run: |
          git config user.name 'vacha-river-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vacha-river/data/hydro.json
          if git diff --cached --quiet; then
            echo 'No new readings'
            exit 0
          fi
          git commit -m 'data(vacha): update water levels from NIMH'
          git pull --rebase origin main
          git push origin HEAD:main
