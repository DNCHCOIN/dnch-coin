name: DNCH Coin v2 - devnet transaction smoke test

# Runs once when this workflow file changes. Test-only signing wallet is generated
# on the short-lived GitHub runner; NEVER put a real/mainnet keypair in CI.
on:
  push:
    paths:
      - '.github/workflows/dnch-v2-devnet-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC: https://api.devnet.solana.com
    steps:
      - name: Checkout official project source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Solana CLI (Agave distribution)
        shell: bash
        run: |
          set -Eeuo pipefail
          sh -c "$(curl --retry 3 --retry-delay 3 -fsSL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify Solana command availability
        run: |
          solana --version
          solana-keygen --version
          spl-token --version
      - name: Install official Metaplex CLI
        shell: bash
        run: |
          npm install --global @metaplex-foundation/cli
          mplx --version
      - name: Create isolated disposable devnet wallet
        shell: bash
        run: |
          set -Eeuo pipefail
          # Devnet only. No custody of real assets; DO NOT print the secret.
          echo "TEST_KEYPAIR=$RUNNER_TEMP/dnch-devnet-smoke-key.json" >> "$GITHUB_ENV"
          solana-keygen new --no-bip39-passphrase --silent --outfile "$RUNNER_TEMP/dnch-devnet-smoke-key.json" >/dev/null
          chmod 600 "$RUNNER_TEMP/dnch-devnet-smoke-key.json"
          echo "Disposable test wallet created (secret not displayed)."
      - name: Fund temporary test wallet with valueless devnet SOL
        shell: bash
        run: |
          set -Eeuo pipefail
          P="$(solana-keygen pubkey "$TEST_KEYPAIR")"
          ok=0
          for attempt in 1 2 3; do
            if solana airdrop 1 "$P" --url "$SOLANA_RPC"; then
              ok=1
              break
            fi
            echo "Devnet faucet unavailable on attempt $attempt"
            sleep 8
          done
          [ "$ok" = 1 ] || { echo "Unable to obtain valueless devnet SOL; no mainnet operation occurred"; exit 1; }
          solana balance "$P" --url "$SOLANA_RPC"
      - name: Run full DNCH v2 lifecycle on devnet
        shell: bash
        run: |
          set -Eeuo pipefail
          bash token-v2/launch.sh --check "$TEST_KEYPAIR" --network devnet
          printf 'DEVNET-DNCH-V2\n' | bash token-v2/launch.sh --launch "$TEST_KEYPAIR" --network devnet
          bash token-v2/launch.sh --status "$TEST_KEYPAIR" --network devnet
          # Only the disposable TEST token on devnet is finalized.
          printf 'PERMANENTLY-REVOKE-MINT\n' | bash token-v2/launch.sh --finalize "$TEST_KEYPAIR" --network devnet
          echo "DEVNET TEST PASSED. No real SOL, owner wallet, or mainnet transaction used."
      - name: Destroy ephemeral test wallet and local state
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dnch-devnet-smoke-key.json"
          rm -rf "$HOME/.local/share/dnch-v2/devnet"
