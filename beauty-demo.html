<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>LUMI BEAUTY — DNCH Studio Demo</title><style>:root{color-scheme:dark;--accent:#f2a8d2}*{box-sizing:border-box}body{margin:0;background:#0e1219;color:#f5f5f6;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 22px}header{padding:18px 0;border-bottom:1px solid #41495a;background:#151b25}header .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:var(--accent)}.brand{font-weight:900;font-size:1.3rem}.hero{padding:95px 0;background:radial-gradient(ellipse at 80% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%)}h1{font-size:clamp(2.5rem,7vw,4.8rem);line-height:1.1;max-width:800px}h2{margin-top:0}.lead{font-size:1.25rem;color:#d4dce5;max-width:680px}.tag{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.09em}.btn,button{display:inline-block;border:0;border-radius:9px;background:var(--accent);color:#10151c;padding:12px 19px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.section{padding:45px 0 80px}.panel{padding:28px;background:#1b2532;border:1px solid #506077;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}label{display:block}input,select{display:block;width:100%;padding:12px;margin-top:8px;background:#0e1621;color:white;border:1px solid #8b9bac;border-radius:8px;font:inherit}output{display:block;color:var(--accent);font-size:1.35rem;font-weight:800;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.food{padding:20px;border:1px solid #58657a;border-radius:12px;display:flex;flex-direction:column;gap:8px}.food h3{margin:0}.food button{margin-top:auto}.total{margin-top:22px;border:1px solid var(--accent);padding:20px;border-radius:12px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#bdc9d7}footer{padding:25px 0;border-top:1px solid #354257;color:#b7c2ce}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.hero{padding:55px 0}.panel{padding:18px}}</style></head><body><header><div class="wrap"><div class="brand">LUMI BEAUTY</div><a href="studio.html">← DNCH Digital Studio</a></div></header><main><section class="hero"><div class="wrap"><p class="tag">PORTFOLIO CONCEPT · NOT A REAL BUSINESS</p><h1>Your time to shine.</h1><p class="lead">Choose a treatment and save a sample appointment.</p><a class="btn" href="#tool">Try the demo</a></div></section><section class="section" id="tool"><div class="wrap"><div class="panel"><div class="grid"><label>Treatment<select id="service"><option>Manicure</option><option>Haircut</option><option>Brow styling</option><option>Facial</option></select></label><label>Date<input id="date" type="date"></label><label>Time<select id="time"><option>10:00</option><option>11:30</option><option>14:00</option><option>16:00</option></select></label></div><button id="save">Save demo booking</button><output id="result"></output><p class="muted">Demo only: no real orders or bookings are submitted.</p></div></div></section></main><footer><div class="wrap">DNCH Digital Studio · PORTFOLIO CONCEPT · NOT A REAL BUSINESS</div></footer><script>(()=>{'use strict';const $=id=>document.getElementById(id);const eur=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'EUR'}).format(n);const date=$('date');const now=new Date();const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');date.min=today;date.value=today;$('save').onclick=()=>{if(date.value<today)return;const entry={service:$('service').value,date:date.value,time:$('time').value};try{localStorage.setItem('dnch-lumi-demo',JSON.stringify(entry));$('result').textContent="Demo booking saved in this browser only."+' '+entry.service+' · '+entry.date+' · '+entry.time}catch{$('result').textContent='Storage unavailable'}};})();</script></body></html>
